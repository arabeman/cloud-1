services:
  nginx:
    image: nginx:1.30.4
    container_name: nginx
    volumes:
      - wordpress_data:/var/www/html
      - ./requirements/nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../secrets/ssl:/etc/nginx/ssl:ro
    restart: always # TODO: change this value on `unless-stopped`
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      wordpress:
        condition: service_started
    networks:
      - frontend


  wordpress:
    image: wordpress:php8.5-fpm
    container_name: wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: user
      WORDPRESS_DB_PASSWORD: user_password
      WORDPRESS_DB_NAME: db
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend


  wp-cli:
    build:
      context: ./requirements/services/wp-cli
    container_name: wp-cli
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: user
      WORDPRESS_DB_PASSWORD: user_password
      WORDPRESS_DB_NAME: db

      WORDPRESS_URL: https://localhost
      WORDPRESS_TITLE: My WordPress

      WORDPRESS_ADMIN_USER: admin
      WORDPRESS_ADMIN_PASSWORD: admin_password
      WORDPRESS_ADMIN_EMAIL: admin@example.com
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      wordpress:
        condition: service_started
    networks:
      - backend


  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: always # TODO: change this value on `unless-stopped`
    environment:
      MARIADB_DATABASE: db
      MARIADB_USER: user
      MARIADB_PASSWORD: user_password
      MARIADB_ROOT_PASSWORD: root_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend


  phpmyadmin:
    image: phpmyadmin:5.2.0
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge


volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/mariadb